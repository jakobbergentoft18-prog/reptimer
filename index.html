<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191e"><title>Reptimer 🎸</title><style> :root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f7f7f8;background:#17191e}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#17191ef5;z-index:5;padding:14px 16px 12px;border-bottom:1px solid #42454b;backdrop-filter:blur(12px)}.clock{text-align:center;font-size:clamp(48px,13vw,76px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}.buttons{display:flex;gap:9px;justify-content:center}button{border:0;border-radius:12px;padding:12px 18px;background:#343941;color:white;font-size:16px;font-weight:650}button.primary{background:#9ce5aa;color:#102015}button:active{opacity:.75}main{padding:18px 16px 90px;max-width:680px;margin:auto}.hint{font-size:13px;color:#b3b8c2;line-height:1.5}textarea{width:100%;min-height:52vh;background:#22262d;color:#fff;border:1px solid #4b515c;border-radius:12px;padding:16px;font:20px/1.7 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;resize:vertical}label{display:block;margin-bottom:8px;font-weight:650}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools button{font-size:13px;padding:9px 12px}.small{font-size:13px;color:#b3b8c2}.toggle{margin:14px 0}.display{white-space:pre-wrap;font-size:22px;line-height:1.8;overflow-wrap:anywhere}.display .section{color:#9ce5aa;font-weight:800}.display .timestamp{color:#ffd28c;font-weight:700} </style></head><body><header><div class="clock" id="clock">00:00.0</div><div class="buttons"><button class="primary" id="start">Start</button><button id="reset">Nollställ</button></div></header><main><label for="lyrics">Låttext</label><p class="hint">Skriv eller klistra in texten. Ange exempelvis [0:18] VERS 1 och [0:52] REFRÄNG. Texten sparas automatiskt på den här enheten.</p><div class="tools"><button id="edit">Visa som sångblad</button><button id="sample">Återställ exempeltext</button></div><textarea id="lyrics" spellcheck="false">[0:18] VERS 1
Här börjar första textraden...
Här fortsätter nästa rad...

[0:52] REFRÄNG
Här börjar refrängen...

[1:24] VERS 2
Här börjar andra versen...</textarea><div id="display" class="display" hidden></div><p class="small">Tips: lägg till sidan på hemskärmen via Safaris Dela-meny. Håll skärmen vaken under repet genom att ändra Autolås i iPhone-inställningarna.</p></main><script>const clock=document.getElementById('clock'),start=document.getElementById('start'),reset=document.getElementById('reset'),lyrics=document.getElementById('lyrics'),display=document.getElementById('display'),edit=document.getElementById('edit');let elapsed=0,started=0,running=false,view=false;const saved=localStorage.getItem('reptimer-lyrics');if(saved!==null)lyrics.value=saved;function time(){return running?elapsed+performance.now()-started:elapsed}function render(){let n=Math.floor(time()/100),m=Math.floor(n/600),s=Math.floor(n%600/10),d=n%10;clock.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;if(running)requestAnimationFrame(render)}start.onclick=()=>{if(running){elapsed=time();running=false;start.textContent='Fortsätt';start.classList.add('primary')}else{started=performance.now();running=true;start.textContent='Paus';start.classList.remove('primary');render()}};reset.onclick=()=>{elapsed=0;started=performance.now();render()};lyrics.oninput=()=>{localStorage.setItem('reptimer-lyrics',lyrics.value);updateDisplay()};function updateDisplay(){display.replaceChildren();lyrics.value.split('\n').forEach((line,i)=>{const span=document.createElement('span');span.textContent=line;if(/^\s*(\[\d+:\d+\])?\s*(VERS|REFRÄNG|INTRO|BRYGGA|OUTRO|MELLANSPEL)/i.test(line))span.className='section';else if(/^\s*\[\d+:\d+\]/.test(line))span.className='timestamp';display.append(span);if(i<lyrics.value.split('\n').length-1)display.append(document.createTextNode('\n'))})}edit.onclick=()=>{view=!view;lyrics.hidden=view;display.hidden=!view;edit.textContent=view?'Redigera text':'Visa som sångblad';if(view)updateDisplay()};document.getElementById('sample').onclick=()=>{if(confirm('Ersätta den nuvarande texten med exempeltexten?')){lyrics.value='[0:18] VERS 1\nHär börjar första textraden...\n\n[0:52] REFRÄNG\nHär börjar refrängen...\n\n[1:24] VERS 2\nHär börjar andra versen...';lyrics.dispatchEvent(new Event('input'))}};render();</script></body></html>
